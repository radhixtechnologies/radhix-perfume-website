<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E1F5FE" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#051824" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="25%" stop-color="#F5D77A"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#FFEAA7"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#2a2010" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#120e06" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E1F5FE" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#4FC3F7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3d2a05" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="goldGlowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="800" fill="url(#bgGlow)"/>

  <!-- Light Beam Aura Behind Bottle -->
  <ellipse cx="300" cy="450" rx="180" ry="240" fill="#4FC3F7" opacity="0.15" filter="url(#goldGlowEffect)"/>

  <!-- Bottle Cap (Heavy Gold Metal Crown) -->
  <g id="cap">
    <!-- Cap Neck ring -->
    <rect x="260" y="190" width="80" height="25" rx="3" fill="url(#goldCap)"/>
    <rect x="250" y="215" width="100" height="15" rx="2" fill="url(#goldCap)"/>
    <!-- Main Cap Block -->
    <rect x="240" y="90" width="120" height="100" rx="8" fill="url(#goldCap)" stroke="#FFEAA7" stroke-width="1.5"/>
    <!-- Facet cuts on cap -->
    <line x1="260" y1="90" x2="260" y2="190" stroke="#8B6508" stroke-width="1.5" opacity="0.6"/>
    <line x1="340" y1="90" x2="340" y2="190" stroke="#FFF" stroke-width="1.5" opacity="0.5"/>
    <rect x="270" y="115" width="60" height="50" rx="4" fill="#111" stroke="url(#goldCap)" stroke-width="2"/>
    <text x="300" y="147" font-family="'Cinzel', 'Playfair Display', serif" font-size="20" font-weight="bold" fill="url(#goldCap)" text-anchor="middle" letter-spacing="3">BNB</text>
  </g>

  <!-- Bottle Neck -->
  <rect x="275" y="230" width="50" height="30" fill="#080808" stroke="url(#goldCap)" stroke-width="1"/>

  <!-- Bottle Shoulder & Glass Body -->
  <g id="bottleBody">
    <!-- Outer Heavy Crystal Glass -->
    <rect x="160" y="260" width="280" height="420" rx="28" fill="url(#glassBody)" stroke="url(#goldCap)" stroke-width="3"/>
    
    <!-- Inner Liquid Chamber -->
    <rect x="180" y="280" width="240" height="375" rx="18" fill="url(#liquid)"/>

    <!-- Glass Highlights / Refraction Reflection Lines -->
    <path d="M 175 285 L 175 660" stroke="#ffffff" stroke-width="5" opacity="0.25" stroke-linecap="round"/>
    <path d="M 190 295 L 190 645" stroke="#ffffff" stroke-width="2" opacity="0.15" stroke-linecap="round"/>
    <path d="M 425 285 L 425 660" stroke="#E1F5FE" stroke-width="3" opacity="0.4" stroke-linecap="round"/>

    <!-- Heavy Metal Base -->
    <rect x="160" y="660" width="280" height="30" rx="10" fill="url(#goldCap)"/>

    <!-- Luxury Metal Plaque Label on Bottle Center -->
    <g id="plaque" filter="url(#goldGlowEffect)">
      <rect x="205" y="380" width="190" height="175" rx="10" fill="#0a0a0a" stroke="url(#goldCap)" stroke-width="2.5"/>
      <rect x="212" y="387" width="176" height="161" rx="6" fill="none" stroke="url(#goldCap)" stroke-width="1" stroke-dasharray="4,2"/>
      
      <!-- Monogram -->
      <circle cx="300" cy="425" r="22" fill="#141414" stroke="url(#goldCap)" stroke-width="1.5"/>
      <text x="300" y="432" font-family="'Cinzel', 'Playfair Display', serif" font-size="16" font-weight="bold" fill="url(#goldCap)" text-anchor="middle" letter-spacing="2">BNB</text>

      <text x="300" y="470" font-family="'Cinzel', 'Playfair Display', serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">BNB ELIXIR BLANC</text>
      
      <line x1="240" y1="482" x2="360" y2="482" stroke="url(#goldCap)" stroke-width="1"/>

      <text x="300" y="502" font-family="'Montserrat', 'Inter', sans-serif" font-size="9" font-weight="600" fill="url(#goldCap)" text-anchor="middle" letter-spacing="2">ORIGINALS</text>
      <text x="300" y="522" font-family="'Inter', sans-serif" font-size="8" fill="#B3B3B3" text-anchor="middle" letter-spacing="1.5">EXTRAIT DE PARFUM • 100 ML</text>
    </g>
  </g>

  <!-- Ambient Sparkling Floating Dust Particles -->
  <circle cx="140" cy="350" r="2" fill="#E1F5FE" opacity="0.8"/>
  <circle cx="450" cy="320" r="3" fill="#E1F5FE" opacity="0.9"/>
  <circle cx="480" cy="500" r="1.5" fill="#4FC3F7" opacity="0.7"/>
  <circle cx="120" cy="560" r="2.5" fill="#E1F5FE" opacity="0.7"/>
  <circle cx="300" cy="720" r="2" fill="#4FC3F7" opacity="0.6"/>
</svg>